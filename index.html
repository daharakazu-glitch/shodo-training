<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>書道トレーニング | 小学生向け</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="container">
    <header class="shodo-header">
      <h1>書道トレーニング</h1>
      <p>毛筆で書いた作品を、カメラで撮って採点します</p>
    </header>

    <section class="progress-card">
      <div class="progress-stat">
        <span>学習済みの文字</span>
        <b id="statNum">0 / 0</b>
      </div>
      <div class="bar"><i id="barFill"></i></div>
    </section>

    <section class="grade-section">
      <h2>学年を選ぼう</h2>
      <div class="grade-grid" id="gradeGrid">
        <!-- JS で動的生成 -->
      </div>
    </section>

    <section class="tutorial-card">
      <h2>使い方</h2>
      <ol>
        <li><strong>学年と文字を選ぶ</strong></li>
        <li><strong>書き順を見る</strong>：筆の運びと「とめ・はね・はらい」を確かめます</li>
        <li><strong>毛筆で半紙に書く</strong>：画面では書きません。実際に筆で書きます</li>
        <li><strong>カメラで撮る</strong>：半紙が画面いっぱいに入るよう、まっすぐ上から写します</li>
        <li><strong>採点をもらう</strong>：とめ・はね・はらい／字形・骨格／配置・余白の3つで見ます</li>
      </ol>
      <p class="note">
        先生は、毛筆で書いたお手本を撮影して登録できます。登録するとその字はお手本と比べて採点されます。
      </p>
    </section>

    <footer class="footer">
      <p>© 2026 AIチーム 書道トレーニング</p>
    </footer>
  </div>

  <script src="data/grades-meta.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/dashboard.js"></script>
</body>
</html>
